<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALERTA DIGITAL</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="/socket.io/socket.io.js"></script>
  <script defer src="js/host.js"></script>

  <style>
    /* Ajustes para proyección centrada en pared */
    .dashboard {
      display: flex !important;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 15px 25px;
    }

    .zona-juego {
      width: 100% !important;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Contenedor horizontal de Ranking y Tiempo en el centro */
    #ranking-container.centro-proyeccion {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: stretch;
      gap: 20px;
      width: 100%;
      margin: 15px 0;
    }

    #ranking-container.centro-proyeccion #ranking,
    #ranking-container.centro-proyeccion #timer-container {
      flex: 1;
      width: auto;
    }

    /* Bloque de equipo compacto al pie para que no se corte en los bordes */
    .equipo-pie {
      width: 100%;
      margin-top: 25px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      font-size: 0.85rem;
    }

    .equipo-pie h3 {
      font-size: 0.9rem;
      margin-bottom: 6px;
      opacity: 0.85;
    }

    .equipo-pie p {
      margin: 4px 0;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <main class="dashboard">

    <!-- COLUMNA CENTRAL ÚNICA OPTIMIZADA PARA PROYECTOR -->
    <section class="zona-juego">
      <header class="encabezado">
        <h1>ALERTA DIGITAL</h1>
        <h2>EFP SAN VICENTE DE PAUL</h2>
        <p>Desarrollado por el TRAYECTO DE INFORMÁTICA</p>
      </header>

      <!-- RANKING Y TIEMPO ORDENADOS EN EL CENTRO -->
      <section id="ranking-container" class="centro-proyeccion">
        <div id="ranking">
          <h3>RANKING</h3>
        </div>
        <div id="timer-container">
          <h3>TIEMPO</h3>
          <div id="timer-number">0</div>
          <div class="timer-track">
            <div id="timer-bar"></div>
          </div>
        </div>
      </section>

      <button id="startBtn" type="button">
        INICIAR JUEGO
      </button>

      <div id="question" aria-live="polite"></div>
      <div id="answers"></div>

      <!-- CRÉDITOS COMPACTOS AL PIE -->
      <footer class="equipo-pie">
        <h3>EQUIPO DE DESARROLLO</h3>
        <p>
          <strong>Integrantes:</strong> Ignacio Fecha · Patricia Escobar · Melian Adrian · Cecilia Leguina
        </p>
        <p>
          <strong>Docente:</strong> Prof. Gonzalo Berenguel
        </p>
      </footer>
    </section>

  </main>

</body>
</html>
